<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>GadgetStore Pro - Management System</title>
    <style>
        :root { --soft-pink: #fff0f3; --accent-pink: #ff69b4; --dark-pink: #d81b60; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdfdfd; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        header { background: var(--dark-pink); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { background: var(--accent-pink); color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .hidden { display: none; }
        img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        video { width: 100%; height: 180px; background: #000; margin: 10px 0; }
        .status-box { padding: 15px; background: var(--soft-pink); border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<!-- Halaman Login -->
<div id="loginPage" class="box" style="max-width:400px; margin:auto;">
    <h2>GadgetStore Login</h2>
    <select id="role"><option value="admin">Administrator</option><option value="customer">Pembeli</option></select>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Masuk ke Sistem</button>
</div>

<!-- Dashboard Utama -->
<div id="app" class="hidden">
    <header><h1>GadgetStore Management System</h1></header>
    
    <!-- Admin Panel -->
    <div id="adminPanel" class="box hidden">
        <h2>Panel Admin (Input Produk)</h2>
        <input type="text" id="iName" placeholder="Nama Produk">
        <textarea id="iDesc" placeholder="Deskripsi & Harga"></textarea>
        <input type="url" id="iImg" placeholder="URL Gambar Produk">
        <button onclick="alert('Produk berhasil disimpan ke database!')">Simpan Produk ke Database</button>
        <div class="status-box">
            <h3>Status Pesanan (Monitor)</h3>
            <p id="adminStatus">Belum ada pesanan masuk.</p>
        </div>
    </div>

    <!-- Customer Panel -->
    <div id="customerPanel" class="box hidden">
        <h2>Katalog Gadget</h2>
        <div id="catalog" class="grid"></div>
        <div class="box">
            <h2>Keranjang Belanja</h2>
            <div id="cartItems"></div>
            <h3>Total: Rp <span id="total">0</span></h3>
            <select id="payMethod"><option>Transfer Bank</option><option>E-Wallet</option><option>COD</option></select>
            <button onclick="checkout()">Beli Sekarang (Checkout)</button>
            <p id="custStatus" style="font-weight:bold; color:var(--dark-pink);"></p>
        </div>
    </div>
</div>

<script>
    const products = [
        {name: "iPhone 15 Pro", price: 18500000, desc: "Chip A17 Pro, 120Hz", img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500", vid: "https://www.w3schools.com/html/mov_bbb.mp4"},
        {name: "Samsung S24 Ultra", price: 20999000, desc: "Snapdragon 8 Gen 3", img: "https://images.unsplash.com/photo-1707343843437-caacff5cfa74?w=500", vid: "https://www.w3schools.com/html/mov_bbb.mp4"},
        {name: "Xiaomi 14 Pro", price: 11999000, desc: "Leica Lens, RAM 12GB", img: "https://images.unsplash.com/photo-1696446701796-da61225697cc?w=500", vid: "https://www.w3schools.com/html/mov_bbb.mp4"},
        {name: "iPhone 14", price: 13200000, desc: "A15 Bionic, Kamera Dual", img: "https://images.unsplash.com/photo-1678685880041-067645f7783d?w=500", vid: "https://www.w3schools.com/html/mov_bbb.mp4"},
        {name: "Google Pixel 8", price: 10500000, desc: "Tensor G3, AI Camera", img: "https://images.unsplash.com/photo-1697204642232-a59f9ef78484?w=500", vid: "https://www.w3schools.com/html/mov_bbb.mp4"},
        {name: "Oppo Find X7", price: 16700000, desc: "SuperVOOC 100W", img: "https://images.unsplash.com/photo-1616348436168-de43ad0db179?w=500", vid: "https://www.w3schools.com/html/mov_bbb.mp4"}
    ];

    let cart = [];

    function login() {
        const role = document.getElementById('role').value;
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        if(role === 'admin') document.getElementById('adminPanel').classList.remove('hidden');
        else { document.getElementById('customerPanel').classList.remove('hidden'); render(); }
    }

    function render() {
        const cat = document.getElementById('catalog');
        products.forEach(p => {
            cat.innerHTML += `
                <div class="box">
                    <img src="${p.img}">
                    <h3>${p.name}</h3>
                    <p><b>Rp ${p.price.toLocaleString()}</b><br>${p.desc}</p>
                    <video controls><source src="${p.vid}" type="video/mp4"></video>
                    <select id="clr-${p.name}"><option>Space Black</option><option>Silver</option><option>Gold</option></select>
                    <button onclick="add('${p.name}', ${p.price})">Tambah ke Keranjang</button>
                </div>`;
        });
    }

    function add(name, price) {
        const color = document.getElementById('clr-'+name).value;
        cart.push({name, price, color});
        document.getElementById('cartItems').innerHTML += `<p>${name} (${color}) - Rp ${price.toLocaleString()}</p>`;
        document.getElementById('total').innerText = cart.reduce((a,b) => a + b.price, 0).toLocaleString();
    }

    function checkout() {
        if(cart.length === 0) return alert("Keranjang kosong!");
        const status = "Pesanan Diproses (" + document.getElementById('payMethod').value + ")";
        document.getElementById('custStatus').innerText = "Status: " + status;
        document.getElementById('adminStatus').innerText = "Status Pembeli: " + status;
        alert("Terima kasih! " + status);
    }
</script>
</body>
</html>

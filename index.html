<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>GadgetStore Pro - System Checkout</title>
    <style>
        body { background-color: #ffeef2; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        /* Layout Header */
        .header { background: #ff758c; color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        
        /* Layout Grid Utama */
        .wrapper { display: flex; gap: 20px; align-items: flex-start; }
        
        /* Panel Kiri: Admin (Form) */
        .admin-section { width: 300px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Panel Kanan: Katalog & Checkout */
        .shop-section { flex-grow: 1; display: flex; flex-direction: column; gap: 20px; }
        
        /* Grid Produk */
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .product-item { background: white; padding: 15px; border-radius: 15px; border: 2px solid #ffccd5; }
        .product-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        
        /* Area Checkout */
        .checkout-area { background: #ffafcc; padding: 20px; border-radius: 15px; }
        
        button { cursor: pointer; background: #ff4d6d; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div class="header"><h1>GadgetStore Pro - Management & Transaction</h1></div>

<div class="wrapper">
    <!-- Panel Admin -->
    <div class="admin-section">
        <h3>Panel Admin</h3>
        <input type="text" id="pName" placeholder="Nama Produk" style="width:100%; margin-bottom:10px;"><br>
        <textarea id="pDesc" placeholder="Deskripsi" style="width:100%; margin-bottom:10px;"></textarea><br>
        <button onclick="alert('Produk Disimpan!')">Simpan Produk</button>
        <hr>
        <h4>Status Pesanan:</h4>
        <select id="statusOrder">
            <option>Belum Dibayar</option>
            <option>Diproses</option>
            <option>Dikirim</option>
            <option>Selesai</option>
        </select>
    </div>

    <!-- Panel Katalog & Checkout -->
    <div class="shop-section">
        <div class="product-grid" id="catalog">
            <!-- Contoh 1 Produk (Ulangi untuk 6 produk) -->
            <div class="product-item">
                <img src="https://via.placeholder.com/150/ffb6c1/ffffff?text=Gadget">
                <h4>Smartphone Premium</h4>
                <p>Harga: Rp 12.000.000</p>
                <video controls width="100%"><source src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
                <button onclick="addToCart('Smartphone Premium', 12000000)">Tambah ke Keranjang</button>
            </div>
            <!-- (Tambahkan produk lainnya dengan cara yang sama) -->
        </div>

        <div class="checkout-area">
            <h3>Checkout Sekarang</h3>
            <div id="cartList">Keranjang kosong</div>
            <h4 id="totalPrice">Total: Rp 0</h4>
            <button onclick="checkoutNow()" style="background: #2a9d8f;">PROSES PEMBAYARAN</button>
        </div>
    </div>
</div>

<script>
    let cart = [];
    function addToCart(name, price) {
        cart.push({name, price});
        let list = "";
        let total = 0;
        cart.forEach(item => {
            list += item.name + " - Rp " + item.price.toLocaleString() + "<br>";
            total += item.price;
        });
        document.getElementById('cartList').innerHTML = list;
        document.getElementById('totalPrice').innerHTML = "Total: Rp " + total.toLocaleString();
    }

    function checkoutNow() {
        if(cart.length === 0) {
            alert("Keranjang kosong!");
        } else {
            let status = document.getElementById('statusOrder').value;
            alert("Checkout berhasil! Status pesanan Anda: " + status);
            cart = [];
            document.getElementById('cartList').innerHTML = "Keranjang kosong";
            document.getElementById('totalPrice').innerHTML = "Total: Rp 0";
        }
    }
</script>

</body>
</html>
